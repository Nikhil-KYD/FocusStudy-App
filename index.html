<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="images/block2.png">

    <title>TooCozy.com</title>

    <link rel="stylesheet" href="css/firstpage.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- =========================
         BACKGROUND VIDEO
    ========================== -->

    <video
        id="backgroundVideo"
        class="background-video"
        autoplay
        muted
        loop
        playsinline
        poster="images/cozye.jpg"
    >
        <source src="video/cozyroom.mp4" type="video/mp4">
    </video>


    <!-- =========================
         MAIN PAGE
    ========================== -->

    <main class="First-page">


        <!-- =========================
             THEME SELECTOR
        ========================== -->

        <div class="Theme-select">

            <!-- CD VIDEO BUTTON -->

            <button
                id="themeButton"
                class="cd-theme-button"
                type="button"
            >

                <video
                    class="CD-video"
                    autoplay
                    muted
                    loop
                    playsinline
                >
                    <source src="video/cd.mp4" type="video/mp4">
                </video>

            </button>


            <!-- THEME MENU -->

            <div
                class="theme-menu"
                id="themeMenu"
            >

                <h3>Choose Theme ^-^</h3>


                <button
                    type="button"
                    onclick="changeTheme('Forest')"
                >
                    Forest
                </button>


                <button
                    type="button"
                    onclick="changeTheme('bedroom')"
                >
                    Bedroom
                </button>


                <button
                    type="button"
                    onclick="changeTheme('Study room')"
                >
                    Study room
                </button>


                <button
                    type="button"
                    onclick="changeTheme('Snowy Night')"
                >
                    Snowy Night
                </button>


                <button
                    type="button"
                    onclick="changeTheme('Player')"
                >
                    CD Player
                </button>


                <button
                    type="button"
                    onclick="changeTheme('Clouds')"
                >
                    Cozy Clouds
                </button>


                <button
                    type="button"
                    onclick="changeTheme('Cat playing')"
                >
                    Cat Playing
                </button>

            </div>

        </div>

    </main>


    <!-- =========================
         TOP NAVIGATION
    ========================== -->

    <nav class="top-nav">

        <!-- TIMER -->

        <button
            id="timerButton"
            type="button"
        >

            <i data-lucide="timer"></i>

            <span>Timer</span>

        </button>


        <!-- AMBIENT -->

        <button
            id="ambientButton"
            type="button"
        >

            <i data-lucide="music-2"></i>

            <span>Ambient</span>

        </button>


        <!-- TASKS -->

        <button
            id="tasksButton"
            type="button"
        >

            <i data-lucide="check-square"></i>

            <span>Tasks</span>

        </button>


        <!-- PROGRESS -->

        <button
            id="progressButton"
            type="button"
        >

            <i data-lucide="chart-no-axes-column"></i>

            <span>Progress</span>

        </button>

    </nav>


    <!-- =========================
         FOCUS TIMER PANEL
    ========================== -->

    <div
        class="timer-panel"
        id="timerPanel"
    >

        <!-- TIMER HEADER -->

        <div class="timer-header">

            <h2>Focus Timer</h2>

            <button
                id="closeTimer"
                type="button"
            >

                <i data-lucide="x"></i>

            </button>

        </div>


        <!-- TIMER DISPLAY -->

        <div
            class="timer-display"
            id="timerDisplay"
        >
            25:00
        </div>


        <!-- TIMER PRESETS -->

        <div class="timer-presets">

            <button
                type="button"
                data-time="25"
            >
                25 min
            </button>


            <button
                type="button"
                data-time="50"
            >
                50 min
            </button>


            <button
                type="button"
                data-time="90"
            >
                90 min
            </button>

        </div>


        <!-- TIMER CONTROLS -->

        <div class="timer-controls">

            <button
                id="startTimer"
                type="button"
            >

                <i data-lucide="play"></i>

                Start

            </button>


            <button
                id="resetTimer"
                type="button"
            >

                <i data-lucide="rotate-ccw"></i>

                Reset

            </button>

        </div>

    </div>


    <!-- =========================
         FUTURE PANELS
         We'll build these next.
    ========================== -->

    <!-- Ambient panel will go here -->
     <!-- =========================
     AMBIENT PANEL
========================= -->

<div class="ambient-panel" id="ambientPanel">

    <div class="ambient-header">

        <h2>Ambient Sounds</h2>

        <button id="closeAmbient" type="button">
            <i data-lucide="x"></i>
        </button>

    </div>


    <div class="ambient-sounds">

        <button class="sound-button" data-sound="rain">
            <i data-lucide="cloud-rain"></i>
            <span>Rain</span>
            <span class="sound-status">OFF</span>
        </button>


        <button class="sound-button" data-sound="fire">
            <i data-lucide="flame"></i>
            <span>Fireplace</span>
            <span class="sound-status">OFF</span>
        </button>


        <button class="sound-button" data-sound="forest">
            <i data-lucide="trees"></i>
            <span>Forest</span>
            <span class="sound-status">OFF</span>
        </button>


        <button class="sound-button" data-sound="ocean">
            <i data-lucide="waves"></i>
            <span>Ocean</span>
            <span class="sound-status">OFF</span>
        </button>

    </div>


    <div class="volume-control">

        <i data-lucide="volume-2"></i>

        <input
            type="range"
            id="ambientVolume"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
        >

    </div>

</div>

    <!-- Tasks panel will go here -->

    <!-- Progress panel will go here -->


    <!-- =========================
         LUCIDE ICON INITIALIZATION
    ========================== -->

    <script>
        lucide.createIcons();
    </script>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/theme.js"></script>


</body>

</html>
