<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>^ ^ Library</title>
     <link rel="stylesheet" href="css/firstpage.css">
     <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <video id="backgroundVideo" class="background-video" autoplay muted loop playsinline
    poster="images/cozye.jpg">
    <source src="video/cozyroom.mp4" type="video/mp4">
</video>
    <main class="First-page">



        <!--Theme selector-->
        <div class="Theme-select">

        <button id="themeButton">Theme</button>
        
        <div class="theme-menu" id="themeMenu">
            <h3>Choose Theme</h3>
            <button onclick="changeTheme('Forest')">
                Forest
            </button>

            <button onclick="changeTheme('bedroom')">
                Bedroom
            </button>
            <button onclick="changeTheme('Study room')">
                Study room
            </button>
            <button onclick="changeTheme('Winter')">
                Winter
            </button>
            <button onclick="changeTheme('Cat playing')"">
                Cat Playing
            </button>
            
            </div>

        </div>

        </main>

        <nav class="top-nav">

    <button>
        <i data-lucide="timer"></i>
        <span>Timer</span>
    </button>

    <button>
        <i data-lucide="music-2"></i>
        <span>Ambient</span>
    </button>

    <button>
        <i data-lucide="check-square"></i>
        <span>Tasks</span>
    </button>

    <button>
        <i data-lucide="chart-no-axes-column"></i>
        <span>Progress</span>
    </button>

</nav>

<script>
    lucide.createIcons();
</script>



        <script src="js/theme.js"> </script>

        </body>
        </html>
