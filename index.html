        <!--Theme selector-->
        <div class="Theme-select">

      <button id="themeButton" class="cd-theme-button">
    <video class="CD-video" autoplay muted loop playsinline>
        <source src="video/cd.mp4" type="video/mp4">
    </video>
</button>

        
        <div class="theme-menu" id="themeMenu">
            <h3>Choose Theme ^-^</h3>
            <button onclick="changeTheme('Forest')">
                Forest
            </button>
            <button onclick = "changeTheme('Player')">
                CD Player
            </button>
            <button onclick="changeTheme('bedroom')">
                Bedroom
            </button>
            <button onclick="changeTheme('Study room')">
                Study room
            </button>
            <button onclick="changeTheme('Snowy Night')">
                Snowy Night
            </button>
            <button onclick ="changeTheme('Clouds')">
                Cozy clouds
            </button>
            <button onclick="changeTheme('Cat playing')">
                Cat Playing
            </button>

            
            </div>

        </div>

        </main>

        <nav class="top-nav">

    <button id="timerButton">
        <i data-lucide="timer"></i>
        <span>Timer</span>
    </button>

    <button>
        <i data-lucide="music-2"></i>
        <span>Ambient</span>
    </button>

    <button>
        <i data-lucide="check-square"></i>
        <span>Tasks</span>
    </button>

    <button>
        <i data-lucide="chart-no-axes-column"></i>
        <span>Progress</span>
    </button>

</nav>

<div class="timer-panel" id="timerPanel">

    <div class="timer-header">
        <h2>Focus Timer</h2>

        <button id="closeTimer">
            <i data-lucide="x"></i>
        </button>
    </div>
    <div class="timer-display" id="timerDisplay">
        25:00.
    </div>

    <div class="timer-presets">

        <button data-time="25">25 min</button>

        <button data-time="50">50 min</button>

        <button data-time="90">90 min</button>

    </div>

    <div class="timer-controls">

        <button id="startTimer">
            <i data-lucide="play"></i>
            Start
        </button>

        <button id="resetTimer">
            <i data-lucide="rotate-ccw"></i>
            Reset
        </button>

    </div>

</div>
